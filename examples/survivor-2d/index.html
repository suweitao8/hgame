<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d1117">
  <title>Horde Survivor</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <canvas id="game" aria-label="Game view"></canvas>
  <div id="hud" aria-live="polite">
    <div class="bars"><div id="hp" class="bar hp"><i></i></div><div id="xp" class="bar xp"><i></i></div></div>

    <div id="levelup" hidden></div>
    <div id="gameover" hidden><h2>Overrun</h2><p id="result"></p><button id="restart">Again (U)</button></div>
  </div>
  <script type="module" src="./src/main.js"></script>

</html>
