<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#10130f">
  <title>角色资产 · WebAsset</title>
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./css/site.css">
  <script type="importmap">{"imports":{"three":"/vendor/three/build/three.module.js","three/addons/":"/vendor/three/examples/jsm/","three/examples/jsm/":"/vendor/three/examples/jsm/"}}</script>
  <script type="module" src="./js/hgame-ui-shell.js"></script>
  <script type="module" src="./js/site.js"></script>
  <script type="module" src="./js/games.js"></script>
  <script type="module" src="./js/hgame-models.js"></script>
  <script type="module" src="./js/hgame-animations.js"></script>
  <script type="module" src="./js/hgame-vfx.js"></script>
  <script type="module" src="./js/hgame-materials.js"></script>
  <script type="module" src="./js/hgame-decals.js"></script>
  <script type="module" src="./js/hgame-audio.js"></script>
  <script type="module" src="./js/hgame-music.js"></script>
  <script type="module" src="./js/hgame-tests.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/" aria-label="WebAsset">
      <span class="brand-mark">W</span>
      <span>WEB ASSET</span>
    </a>
    <nav class="main-nav" aria-label="工作区" role="tablist">
      <button type="button" class="nav-tab" id="nav-characters" data-workspace="characters" role="tab" aria-controls="assets-view" aria-selected="true" tabindex="0">角色</button>
      <button type="button" class="nav-tab" id="nav-games" data-workspace="games" role="tab" aria-controls="games-view" aria-selected="false" tabindex="-1">游戏</button>
      <button type="button" class="nav-tab" id="nav-models" data-workspace="models" role="tab" aria-controls="models-view" aria-selected="false" tabindex="-1">模型</button>
      <button type="button" class="nav-tab" id="nav-animations" data-workspace="animations" role="tab" aria-controls="animations-view" aria-selected="false" tabindex="-1">动画</button>
      <button type="button" class="nav-tab" id="nav-vfx" data-workspace="vfx" role="tab" aria-controls="vfx-view" aria-selected="false" tabindex="-1">特效</button>
      <button type="button" class="nav-tab" id="nav-materials" data-workspace="materials" role="tab" aria-controls="materials-view" aria-selected="false" tabindex="-1">材质</button>
      <button type="button" class="nav-tab" id="nav-decals" data-workspace="decals" role="tab" aria-controls="decals-view" aria-selected="false" tabindex="-1">贴花</button>
      <button type="button" class="nav-tab" id="nav-audio" data-workspace="audio" role="tab" aria-controls="audio-view" aria-selected="false" tabindex="-1">音效</button>
      <button type="button" class="nav-tab" id="nav-music" data-workspace="music" role="tab" aria-controls="music-view" aria-selected="false" tabindex="-1">音乐</button>
      <button type="button" class="nav-tab" id="nav-tests" data-workspace="tests" role="tab" aria-controls="tests-view" aria-selected="false" tabindex="-1">测试</button>
    </nav>
    <div class="header-status" title="本机资产服务"><span class="status-dot"></span></div>
  </header>

  <main id="assets-view" class="workspace-layout assets-layout">
    <aside class="workspace-sidebar asset-sidebar" aria-label="角色列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="character-search">
          <span aria-hidden="true">⌕</span>
          <input id="character-search" type="search" placeholder="搜索角色" autocomplete="off">
        </label>
        <button id="character-create-button" class="character-create-button" type="button" aria-label="新增角色" title="新增角色">
          <span aria-hidden="true">＋</span>
        </button>
      </div>
      <nav id="character-list" class="asset-character-list" aria-label="选择角色"></nav>
    </aside>

    <section class="assets-stage-shell" aria-label="角色工作台">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="asset-character-title">角色</h2>
          <button id="character-rename-button" class="character-rename-button" type="button" aria-label="改名" title="改名" hidden>✎</button>
          <form id="character-rename-form" class="character-rename-form" hidden>
            <input id="character-rename-input" name="name" type="text" maxlength="64" required autocomplete="off" aria-label="角色名称">
            <button type="submit" class="character-rename-save" aria-label="保存名称" title="保存">✓</button>
            <button type="button" class="character-rename-cancel" aria-label="取消改名" title="取消">✕</button>
          </form>
        </div>
        <div class="hgame-stage-actions">
          <div class="character-mode-tabs" role="tablist" aria-label="角色子视图">
            <button type="button" class="character-mode-tab asset-stage-tab" role="tab" data-asset-stage="models" aria-selected="true" tabindex="0">3D 模型</button>
            <button type="button" class="character-mode-tab asset-stage-tab" role="tab" data-asset-stage="gallery" aria-selected="false" tabindex="-1">参考/生成图</button>
            <button type="button" class="character-mode-tab asset-stage-tab" role="tab" data-asset-stage="settings" aria-selected="false" tabindex="-1">设定</button>
          </div>
        </div>
      </div>

      <div id="asset-stage-body" class="assets-stage-body" data-asset-tab="models">
        <section id="asset-model-section" class="asset-model-section" aria-labelledby="asset-model-heading">
          <div class="asset-section-heading asset-model-heading">
            <h2 id="asset-model-heading" hidden>3D 模型</h2>
            <div class="asset-model-meta">
              <span id="asset-model-status" class="hgame-status-text" role="status" aria-live="polite"></span>
              <button id="asset-model-run" class="asset-model-action" type="button" hidden disabled>Run</button>
              <label id="asset-model-uv-source-controls" class="hgame-field" hidden><span>UV 来源</span><select id="asset-model-uv-source"></select></label>
              <label id="asset-model-uv-controls" class="hgame-field" hidden><span>网格</span><select id="asset-model-uv-mesh"></select></label>
            </div>
            <div class="character-mode-tabs asset-model-tabs" role="tablist" aria-label="3D 模型视图">
              <button class="asset-model-tab character-mode-tab" type="button" role="tab" data-model-view="high" aria-selected="true" aria-controls="asset-model-panel" tabindex="0">高模</button>
              <button class="asset-model-tab character-mode-tab" type="button" role="tab" data-model-view="low" aria-selected="false" aria-controls="asset-model-panel" tabindex="-1">低模</button>
              <button class="asset-model-tab character-mode-tab" type="button" role="tab" data-model-view="uv" aria-selected="false" aria-controls="asset-model-panel" tabindex="-1">UV</button>
            </div>
            <div class="asset-model-toolbar">
              <a id="asset-model-filename" class="asset-model-filename" hidden download></a>
            </div>
          </div>
          <div id="asset-model-panel" class="asset-model-panel" role="tabpanel" aria-live="polite">
            <div id="asset-model-empty" class="asset-model-empty">暂无高模</div>
            <div id="asset-model-stage" class="asset-model-stage" hidden></div>
            <canvas id="asset-model-uv-canvas" class="asset-model-uv-canvas" width="960" height="600" hidden></canvas>
          </div>
        </section>

        <div id="asset-gallery-pane" class="asset-image-columns" hidden>
          <section class="asset-reference-section" aria-labelledby="asset-reference-heading">
            <div class="asset-section-heading">
              <h2 id="asset-reference-heading">参考图</h2>
              <span id="asset-reference-count" class="asset-section-count"></span>
            </div>
            <div id="asset-results" class="asset-results asset-character-gallery" aria-live="polite"></div>
          </section>
          <section class="asset-ai-section" aria-labelledby="asset-ai-heading">
            <div class="asset-section-heading">
              <h2 id="asset-ai-heading">生成图</h2>
              <div class="asset-ai-heading-actions">
                <time id="character-image-generated-at" class="asset-ai-generated-at" hidden></time>
                <div class="character-mode-tabs" role="tablist" aria-label="生图形态">
                  <button type="button" class="character-mode-tab asset-ai-mode-tab" role="tab" data-mode="default" aria-selected="true" aria-controls="asset-ai-results" tabindex="0">影视</button>
                  <button type="button" class="character-mode-tab asset-ai-mode-tab" role="tab" data-mode="humanoid" aria-selected="false" aria-controls="asset-ai-results" tabindex="-1">模型</button>
                </div>
                <button id="character-image-generate-button" class="asset-ai-generate-button" type="button">✦ AI 生图</button>
              </div>
            </div>
            <div id="asset-ai-results" class="asset-ai-results" aria-live="polite" role="tabpanel"></div>
          </section>
        </div>

        <div id="asset-settings-pane" class="asset-details-columns" hidden>
          <section class="asset-settings-section" aria-labelledby="asset-settings-heading">
            <div class="asset-section-heading">
              <h2 id="asset-settings-heading">设定</h2>
            </div>
            <div id="asset-settings" class="asset-settings-grid"></div>
          </section>
        </div>

        <div id="asset-empty" class="asset-empty" hidden>加载中</div>
      </div>
      <div id="asset-toast" class="asset-toast" role="status" aria-live="polite" hidden></div>
    </section>

    <dialog id="character-create-dialog" class="character-create-dialog" aria-labelledby="character-create-title">
      <form id="character-create-form" class="character-create-form">
        <div class="character-create-heading">
          <h2 id="character-create-title">新增角色</h2>
        </div>
        <label class="character-form-field">
          <span>名字</span>
          <input name="name" type="text" maxlength="64" required placeholder="角色名称">
        </label>
        <p id="character-create-error" class="character-create-error" role="alert" hidden></p>
        <div class="character-create-actions">
          <button class="character-create-cancel" type="button" data-close-character-dialog>取消</button>
          <button class="character-create-submit" type="submit">创建</button>
        </div>
      </form>
    </dialog>
  </main>

  <main id="games-view" class="workspace-layout games-layout" aria-label="网页游戏库" hidden>
    <aside class="workspace-sidebar game-sidebar" aria-label="游戏列表">
      <label class="character-search game-search" for="game-search">
        <span aria-hidden="true">⌕</span>
        <input id="game-search" type="search" placeholder="搜索游戏" autocomplete="off">
      </label>
      <nav id="game-list" class="game-list" aria-label="已添加的游戏"></nav>
      <p id="game-status" class="game-status" role="status" aria-live="polite"></p>
    </aside>
    <section class="preview-panel game-preview-panel" aria-label="游戏预览">
      <div class="game-frame-wrap">
        <iframe id="game-preview" title="HTML 游戏预览" sandbox="allow-scripts allow-pointer-lock allow-downloads" allow="fullscreen; gamepad" referrerpolicy="no-referrer" hidden></iframe>
      </div>
    </section>
  </main>

  <main id="models-view" class="workspace-layout hgame-layout" aria-label="HGame 模型库" hidden>
    <aside class="workspace-sidebar hgame-sidebar" aria-label="模型列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="hgame-model-search">
          <span aria-hidden="true">⌕</span>
          <input id="hgame-model-search" type="search" placeholder="搜索模型" autocomplete="off">
        </label>
        <button id="hgame-model-upload-button" class="character-create-button" type="button" aria-label="上传模型" hidden>
          <span aria-hidden="true">＋</span>
        </button>
        <input id="hgame-model-upload" type="file" accept=".glb" hidden>
      </div>
      <div class="hgame-filter-row">
        <label class="hgame-field hgame-field-full"><span>分类</span>
          <select id="hgame-model-pack-filter">
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <nav id="hgame-model-list" class="hgame-asset-list" aria-label="选择模型"></nav>
    </aside>
    <section class="hgame-stage-panel" aria-label="模型预览">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="hgame-model-title">模型</h2>
          <a id="hgame-model-download" class="asset-model-filename" hidden download></a>
        </div>
        <div class="hgame-stage-actions">
          <div class="character-mode-tabs" role="tablist" aria-label="模型视图">
            <button type="button" class="character-mode-tab hgame-model-tab" role="tab" data-hgame-model-view="3d" aria-selected="true" tabindex="0">3D</button>
            <button type="button" class="character-mode-tab hgame-model-tab" role="tab" data-hgame-model-view="uv" aria-selected="false" tabindex="-1">UV</button>
          </div>
          <button id="hgame-model-delete-button" type="button" class="hgame-danger-button" hidden>删除</button>
        </div>
      </div>
      <div class="hgame-viewport">
        <div id="hgame-model-empty" class="hgame-empty" hidden>暂无模型</div>
        <div id="hgame-model-stage" class="hgame-stage-canvas"></div>
        <canvas id="hgame-model-uv-canvas" class="hgame-uv-canvas" width="960" height="600" hidden></canvas>
      </div>
      <div class="hgame-controls">
        <div class="hgame-control-group">
          <div class="hgame-control-group" id="hgame-model-param-controls" hidden></div>
          <div class="hgame-control-group" id="hgame-model-uv-controls" hidden>
            <label class="hgame-field"><span>网格</span><select id="hgame-model-uv-mesh"></select></label>
          </div>
          <label class="hgame-check"><input id="hgame-model-wireframe" type="checkbox"><span>线框</span></label>
          <label class="hgame-check"><input id="hgame-model-grid" type="checkbox" checked><span>网格</span></label>
          <label class="hgame-check"><input id="hgame-model-bloom" type="checkbox" checked><span>辉光</span></label>
        </div>
        <span id="hgame-model-status" class="hgame-status-text" role="status" aria-live="polite"></span>
      </div>
    </section>
  </main>

  <main id="animations-view" class="workspace-layout hgame-layout" aria-label="HGame 3D 动画库" hidden>
    <aside class="workspace-sidebar hgame-sidebar" aria-label="动画列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="hgame-anim-search">
          <span aria-hidden="true">⌕</span>
          <input id="hgame-anim-search" type="search" placeholder="搜索动作" autocomplete="off">
        </label>
        <button id="hgame-anim-add-button" class="character-create-button" type="button" aria-label="上传动画 GLB" title="上传动画 GLB">
          <span aria-hidden="true">＋</span>
        </button>
        <input id="hgame-anim-glb-upload" type="file" accept=".glb,model/gltf-binary" hidden>
      </div>
      <div class="hgame-filter-row">
        <label class="hgame-field hgame-field-full"><span>筛选</span>
          <select id="hgame-anim-pack-filter">
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <nav id="hgame-anim-list" class="hgame-asset-list" aria-label="选择动作"></nav>
    </aside>
    <section class="hgame-stage-panel" aria-label="动画预览">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="hgame-anim-title">动画</h2>
        </div>
        <div class="hgame-stage-actions">
          <button id="hgame-anim-character-dialog-button" type="button" class="asset-model-action">角色</button>
          <button id="hgame-anim-delete-button" type="button" class="hgame-danger-button" hidden>删除</button>
        </div>
      </div>
      <div id="hgame-anim-3d-pane" class="hgame-subpane">
        <div class="hgame-viewport">
          <div id="hgame-anim-3d-empty" class="hgame-empty">暂无动画</div>
          <div id="hgame-anim-3d-stage" class="hgame-stage-canvas" hidden></div>
        </div>
        <div class="hgame-controls">
          <div class="hgame-control-group">
            <button id="hgame-anim-play-button" type="button" class="asset-model-action">暂停</button>
            <label class="hgame-field"><span>倍速</span>
              <select id="hgame-anim-speed">
                <option value="0.25">0.25x</option>
                <option value="0.5">0.5x</option>
                <option value="1" selected>1.0x</option>
                <option value="1.5">1.5x</option>
                <option value="2">2.0x</option>
              </select>
            </label>
          </div>
          <div class="hgame-audio-seek-row">
            <input id="hgame-anim-scrub" type="range" min="0" max="1" step="0.005" value="0" aria-label="动画进度">
          </div>
          <span id="hgame-anim-3d-status" class="hgame-status-text" role="status" aria-live="polite"></span>
        </div>
      </div>
    </section>
    <dialog id="hgame-character-picker-dialog" class="character-create-dialog hgame-picker-dialog" aria-labelledby="hgame-character-dialog-title">
      <div class="hgame-picker-shell">
        <div class="hgame-picker-header">
          <h2 id="hgame-character-dialog-title">选择角色</h2>
          <button id="hgame-char-dialog-close" type="button" class="hgame-picker-close" aria-label="关闭">×</button>
        </div>
        <div class="hgame-picker-filters">
          <label class="character-search" for="hgame-char-dialog-search">
            <span aria-hidden="true">⌕</span>
            <input id="hgame-char-dialog-search" type="search" placeholder="搜索角色" autocomplete="off">
          </label>
          <label class="hgame-field"><span>资源包</span>
            <select id="hgame-char-dialog-pack">
              <option value="all">全部</option>
            </select>
          </label>
        </div>
        <div id="hgame-char-dialog-list" class="hgame-picker-grid" role="listbox" aria-label="选择角色"></div>
      </div>
    </dialog>
  </main>

  <main id="vfx-view" class="workspace-layout hgame-layout" aria-label="特效资源库" hidden>
    <aside class="workspace-sidebar hgame-sidebar" aria-label="特效列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="hgame-vfx-search">
          <span aria-hidden="true">⌕</span>
          <input id="hgame-vfx-search" type="search" placeholder="搜索特效" autocomplete="off">
        </label>
      </div>
      <div class="hgame-filter-row">
        <label class="hgame-field hgame-field-full"><span>筛选</span>
          <select id="hgame-vfx-type-filter">
            <option value="all">全部特效</option>
          </select>
        </label>
      </div>
      <nav id="hgame-vfx-list" class="hgame-asset-list" aria-label="选择特效"></nav>
    </aside>
    <section class="hgame-stage-panel" aria-label="特效预览">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="hgame-vfx-title">特效</h2>
          <a id="hgame-vfx-download" class="asset-model-filename" hidden download></a>
        </div>
        <div class="hgame-stage-actions">
          <div id="hgame-vfx-mode-tabs" class="character-mode-tabs" role="tablist" aria-label="渲染模式" hidden>
            <button type="button" class="character-mode-tab hgame-vfx-mode-tab" role="tab" data-hgame-vfx-mode="source" aria-selected="true" tabindex="0">源效果</button>
            <button type="button" class="character-mode-tab hgame-vfx-mode-tab" role="tab" data-hgame-vfx-mode="hgame" aria-selected="false" tabindex="-1">运行时</button>
          </div>
          <button id="hgame-vfx-copy-code" type="button" class="asset-model-action" hidden>复制代码</button>
        </div>
      </div>
      <div class="hgame-viewport">
        <div id="hgame-vfx-empty" class="hgame-empty" hidden>暂无特效</div>
        <div id="hgame-vfx-stage" class="hgame-stage-canvas"></div>
      </div>
      <div class="hgame-controls">
        <div class="hgame-control-group">
          <button id="hgame-vfx-play-button" type="button" class="asset-model-action">暂停</button>
          <button id="hgame-vfx-replay-button" type="button" class="asset-model-action">重播</button>
          <label class="hgame-field" id="hgame-vfx-speed-wrap"><span>倍速</span>
            <select id="hgame-vfx-speed">
              <option value="0.25">0.25x</option>
              <option value="0.5">0.5x</option>
              <option value="1" selected>1.0x</option>
            </select>
          </label>
        </div>
        <span id="hgame-vfx-status" class="hgame-status-text" role="status" aria-live="polite"></span>
        <div class="stage-popover-wrap">
          <button type="button" class="asset-model-action stage-params-toggle" aria-expanded="false" aria-controls="hgame-vfx-params-popover" aria-label="特效参数">⚙</button>
          <div id="hgame-vfx-params-popover" class="stage-params-popover" hidden>
            <div class="stage-popover-group">
              <span class="stage-popover-title">渲染</span>
              <div class="stage-popover-grid">
                <label class="hgame-field" id="hgame-vfx-quality-wrap"><span>画质</span>
                  <select id="hgame-vfx-quality">
                    <option value="high" selected>High</option>
                    <option value="med">Med</option>
                    <option value="low">Low</option>
                  </select>
                </label>
                <label class="hgame-check" id="hgame-vfx-bloom-toggle-wrap"><input id="hgame-vfx-bloom-toggle" type="checkbox" checked><span>Bloom</span></label>
                <label class="hgame-check" id="hgame-vfx-grid-toggle-wrap"><input id="hgame-vfx-grid-toggle" type="checkbox" checked><span>网格</span></label>
                <label class="hgame-check"><input id="hgame-vfx-spin" type="checkbox"><span>旋转</span></label>
              </div>
            </div>
            <div class="stage-popover-group" id="hgame-vfx-seq-group">
              <span class="stage-popover-title">序列帧</span>
              <div class="stage-popover-grid">
                <label class="hgame-field" id="hgame-vfx-plane-mode-wrap" hidden><span>形态</span>
                  <select id="hgame-vfx-plane-mode">
                    <option value="auto">自动</option>
                    <option value="billboard">相机</option>
                    <option value="ground">地面</option>
                    <option value="emitter">喷射</option>
                  </select>
                </label>
                <label class="hgame-field" id="hgame-vfx-grid-wrap"><span>切分</span>
                  <select id="hgame-vfx-grid">
                    <option value="auto">自动</option>
                    <option value="1x1">1×1</option>
                    <option value="2x2">2×2</option>
                    <option value="3x3">3×3</option>
                    <option value="4x1">4×1</option>
                    <option value="4x4">4×4</option>
                    <option value="5x5">5×5</option>
                    <option value="8x4">8×4</option>
                    <option value="8x8">8×8</option>
                  </select>
                </label>
                <label class="hgame-field" id="hgame-vfx-fps-wrap"><span>帧率</span><input id="hgame-vfx-fps" type="number" min="1" max="60" value="12"></label>
                <label class="hgame-field" id="hgame-vfx-blend-wrap"><span>混合</span>
                  <select id="hgame-vfx-blend">
                    <option value="additive">发光</option>
                    <option value="normal">透明</option>
                  </select>
                </label>
                <label class="hgame-field"><span>色调</span><input id="hgame-vfx-color" type="color" value="#ffffff"></label>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <main id="materials-view" class="workspace-layout hgame-layout" aria-label="HGame PBR 材质库" hidden>
    <aside class="workspace-sidebar hgame-sidebar" aria-label="材质列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="hgame-material-search">
          <span aria-hidden="true">⌕</span>
          <input id="hgame-material-search" type="search" placeholder="搜索材质" autocomplete="off">
        </label>
      </div>
      <div class="hgame-filter-row">
        <label class="hgame-field hgame-field-full"><span>筛选</span>
          <select id="hgame-material-source-filter">
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <nav id="hgame-material-list" class="hgame-asset-list" aria-label="选择材质"></nav>
    </aside>
    <section class="hgame-stage-panel" aria-label="材质预览">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="hgame-material-title">材质</h2>
        </div>
      </div>
      <div class="hgame-viewport">
        <div id="hgame-material-empty" class="hgame-empty" hidden>暂无材质</div>
        <div id="hgame-material-stage" class="hgame-stage-canvas"></div>
      </div>
    </section>
  </main>

  <main id="decals-view" class="workspace-layout hgame-layout" aria-label="HGame PBR 贴花库" hidden>
    <aside class="workspace-sidebar hgame-sidebar" aria-label="贴花列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="hgame-decal-search">
          <span aria-hidden="true">⌕</span>
          <input id="hgame-decal-search" type="search" placeholder="搜索贴花" autocomplete="off">
        </label>
      </div>
      <div class="hgame-filter-row">
        <label class="hgame-field hgame-field-full"><span>筛选</span>
          <select id="hgame-decal-pack-filter">
            <option value="all">全部贴花</option>
          </select>
        </label>
      </div>
      <nav id="hgame-decal-list" class="hgame-asset-list" aria-label="选择贴花"></nav>
    </aside>
    <section class="hgame-stage-panel" aria-label="贴花预览">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="hgame-decal-title">贴花</h2>
        </div>
        <div class="hgame-stage-actions">
          <div class="character-mode-tabs" role="tablist" aria-label="显示模式">
            <button type="button" class="character-mode-tab hgame-decal-mode-tab" role="tab" data-decal-mode="surface" aria-selected="true" tabindex="0">3D</button>
            <button type="button" class="character-mode-tab hgame-decal-mode-tab" role="tab" data-decal-mode="flat" aria-selected="false" tabindex="-1">平面</button>
          </div>
        </div>
      </div>
      <div class="hgame-viewport">
        <div id="hgame-decal-empty" class="hgame-empty" hidden>暂无贴花</div>
        <div id="hgame-decal-stage" class="hgame-stage-canvas"></div>
      </div>
      <div class="hgame-controls" id="hgame-decal-controls">
        <div class="hgame-control-group">
          <label class="hgame-field" id="hgame-decal-tint-wrap"><span>染色</span><input id="hgame-decal-tint-amount" type="range" min="0" max="1" step="0.05" value="0.75"><output id="hgame-decal-tint-val">75%</output></label>
        </div>
      </div>
    </section>
  </main>

  <main id="audio-view" class="workspace-layout hgame-layout" aria-label="HGame 音效" hidden>
    <aside class="workspace-sidebar hgame-sidebar" aria-label="音效列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="hgame-audio-search">
          <span aria-hidden="true">⌕</span>
          <input id="hgame-audio-search" type="search" placeholder="搜索音效" autocomplete="off">
        </label>
      </div>
      <div class="hgame-filter-row">
        <label class="hgame-field hgame-field-full"><span>筛选</span>
          <select id="hgame-audio-filter">
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <nav id="hgame-audio-list" class="hgame-asset-list hgame-music-list" aria-label="选择音效"></nav>
    </aside>
    <section class="hgame-stage-panel" aria-label="音效预览">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="hgame-audio-title">音效</h2>
          <a id="hgame-audio-download" class="asset-model-filename" hidden download></a>
        </div>
        <div class="hgame-stage-actions">
          <button id="hgame-audio-ref-tone-button" type="button" class="asset-model-action" data-debug-only>校准音</button>
          <button id="hgame-audio-upload-button" type="button" class="asset-model-action">上传</button>
          <input id="hgame-audio-upload" type="file" accept=".mp3,.wav,.ogg,.flac,.opus,audio/*" hidden>
          <button id="hgame-audio-delete-button" type="button" class="hgame-danger-button" hidden>删除</button>
        </div>
      </div>
      <div class="hgame-viewport hgame-audio-viewport">
        <div id="hgame-audio-empty" class="hgame-empty" hidden>暂无音效</div>
        <canvas id="hgame-audio-wave-canvas" width="960" height="320" class="hgame-wave-canvas"></canvas>
        <div id="hgame-audio-metrics" class="hgame-audio-metrics metrics-inline"></div>
      </div>
      <div class="hgame-controls">
        <div class="hgame-control-group">
          <button id="hgame-audio-play-button" type="button" class="asset-model-action">播放</button>
        </div>
        <div class="hgame-audio-seek-row">
          <input id="hgame-audio-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="播放进度">
          <output id="hgame-audio-time">00:00 / 00:00</output>
        </div>
        <div class="hgame-control-group">
          <label class="hgame-check" id="hgame-audio-loop-wrap"><input id="hgame-audio-loop" type="checkbox"><span>循环</span></label>
          <div class="stage-popover-wrap volume-popover-wrap">
            <button type="button" class="asset-model-action volume-popover-toggle" aria-expanded="false" aria-controls="hgame-audio-volume-popover" aria-label="音量">🔊</button>
            <div id="hgame-audio-volume-popover" class="stage-params-popover stage-volume-popover" hidden>
              <input id="hgame-audio-volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="音量">
              <output id="hgame-audio-volume-val">0.80</output>
            </div>
          </div>
        </div>
        <span id="hgame-audio-status" class="hgame-status-text" role="status" aria-live="polite" hidden></span>
      </div>
    </section>
  </main>

  <main id="music-view" class="workspace-layout hgame-layout" aria-label="HGame 音乐库" hidden>
    <aside class="workspace-sidebar hgame-sidebar" aria-label="音乐列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="hgame-music-search">
          <span aria-hidden="true">⌕</span>
          <input id="hgame-music-search" type="search" placeholder="搜索音乐" autocomplete="off">
        </label>
      </div>
      <div class="hgame-filter-row">
        <label class="hgame-field hgame-field-full"><span>筛选</span>
          <select id="hgame-music-filter">
            <option value="all">全部</option>
          </select>
        </label>
      </div>
      <nav id="hgame-music-list" class="hgame-asset-list hgame-music-list" aria-label="选择音乐"></nav>
    </aside>
    <section class="hgame-stage-panel" aria-label="音乐试听">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="hgame-music-title">音乐</h2>
          <a id="hgame-music-download" class="asset-model-filename" hidden download></a>
        </div>
      </div>
      <div class="hgame-viewport hgame-audio-viewport">
        <div id="hgame-music-empty" class="hgame-empty" hidden>暂无音乐</div>
        <canvas id="hgame-music-wave-canvas" width="960" height="320" class="hgame-wave-canvas"></canvas>
        <div id="hgame-music-metrics" class="hgame-audio-metrics metrics-inline"></div>
      </div>
      <div class="hgame-controls">
        <div class="hgame-control-group">
          <button id="hgame-music-play-button" type="button" class="asset-model-action">播放</button>
        </div>
        <div class="hgame-audio-seek-row">
          <input id="hgame-music-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="播放进度">
          <output id="hgame-music-time">00:00 / 00:00</output>
        </div>
        <div class="hgame-control-group">
          <button id="hgame-music-seam-button" type="button" class="asset-model-action">测结尾</button>
          <label class="hgame-check"><input id="hgame-music-loop" type="checkbox" checked><span>循环</span></label>
          <div class="stage-popover-wrap volume-popover-wrap">
            <button type="button" class="asset-model-action volume-popover-toggle" aria-expanded="false" aria-controls="hgame-music-volume-popover" aria-label="音量">🔊</button>
            <div id="hgame-music-volume-popover" class="stage-params-popover stage-volume-popover" hidden>
              <input id="hgame-music-volume" type="range" min="0" max="1" step="0.05" value="0.8" aria-label="音量">
              <output id="hgame-music-volume-val">0.80</output>
            </div>
          </div>
        </div>
        <span id="hgame-music-status" class="hgame-status-text" role="status" aria-live="polite" hidden></span>
      </div>
    </section>
  </main>

  <main id="tests-view" class="workspace-layout hgame-layout" aria-label="3D 场景测试" hidden>
    <aside class="workspace-sidebar hgame-sidebar" aria-label="测试场景列表">
      <div class="asset-sidebar-tools">
        <label class="character-search" for="hgame-test-search">
          <span aria-hidden="true">⌕</span>
          <input id="hgame-test-search" type="search" placeholder="搜索场景" autocomplete="off">
        </label>
      </div>
      <nav id="hgame-test-list" class="hgame-asset-list" aria-label="选择测试场景"></nav>
    </aside>
    <section class="hgame-stage-panel" aria-label="测试场景视口">
      <div class="hgame-stage-header">
        <div class="hgame-stage-title-group">
          <h2 id="hgame-test-title">场景</h2>
        </div>
        <div class="hgame-stage-actions">
          <div class="character-mode-tabs" role="tablist" aria-label="相机模式">
            <button type="button" class="character-mode-tab hgame-test-cam-tab" role="tab" data-test-cam="fly" aria-selected="true" tabindex="0">飞行</button>
            <button type="button" class="character-mode-tab hgame-test-cam-tab" role="tab" data-test-cam="orbit" aria-selected="false" tabindex="-1">轨道</button>
          </div>
        </div>
      </div>
      <div class="hgame-viewport">
        <div id="hgame-test-stage" class="hgame-stage-canvas" tabindex="0" aria-label="3D 场景视口"></div>
        <div id="hgame-test-crosshair" class="hgame-test-crosshair" hidden aria-hidden="true"></div>
        <div class="hgame-test-help-btn">
          <span id="hgame-test-fly-speed" class="hgame-test-fly-speed-chip">9.0 m/s</span>
          <div class="stage-popover-wrap">
            <button id="hgame-test-help-button" type="button" class="asset-model-action stage-params-toggle" aria-expanded="false" aria-controls="hgame-test-help-popover" aria-label="快捷键">?</button>
            <div id="hgame-test-help-popover" class="stage-params-popover" hidden>
              <div class="stage-popover-group">
                <span class="stage-popover-title">快捷键</span>
                <div class="stage-popover-grid">
                  <span>右键+WASD 飞行</span>
                  <span>Q/E 升降</span>
                  <span>Shift 加速</span>
                  <span>滚轮 调速</span>
                  <span>L 锁准星</span>
                  <span>R 重置</span>
                  <span>F 聚焦</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <aside id="hgame-test-inspector" class="hgame-test-inspector" hidden aria-label="展品详情">
          <div class="hgame-inspector-head">
            <strong id="hgame-inspector-title"></strong>
            <button id="hgame-inspector-close" type="button" class="hgame-icon-button" aria-label="关闭">×</button>
          </div>
          <div id="hgame-inspector-subtitle" class="hgame-inspector-subtitle"></div>
          <dl id="hgame-inspector-meta" class="hgame-inspector-meta"></dl>
          <div class="hgame-inspector-actions">
            <button id="hgame-inspector-focus" type="button" class="hgame-mini-button">聚焦 (F)</button>
            <button id="hgame-inspector-open" type="button" class="hgame-mini-button">打开</button>
          </div>
        </aside>
      </div>
      <div class="hgame-controls">
        <div class="hgame-control-group">
          <label class="hgame-field"><span>机位</span>
            <select id="hgame-test-viewpoint">
              <option value="overview">全景</option>
              <option value="crosswalk">路口</option>
              <option value="shopfront">商铺</option>
              <option value="rooftop">天台</option>
              <option value="yard">院落</option>
              <option value="park">公园</option>
            </select>
          </label>
          <label class="hgame-field"><span>光照</span>
            <select id="hgame-test-lighting">
              <option value="cn_cbd_day">CBD 晴昼</option>
              <option value="cn_old_town_dusk">老城暮色</option>
              <option value="cn_horror_night">巷夜怪谈</option>
              <option value="cn_rural_morning">乡村晨雾</option>
            </select>
          </label>
          <button id="hgame-test-reset-cam" type="button" class="asset-model-action">重置</button>
        </div>
        <span id="hgame-test-status" class="hgame-status-text" role="status" aria-live="polite"></span>
        <div class="stage-popover-wrap">
          <button type="button" class="asset-model-action stage-params-toggle" aria-expanded="false" aria-controls="hgame-test-params-popover" aria-label="环境与调试">⚙</button>
          <div id="hgame-test-params-popover" class="stage-params-popover" hidden>
            <div class="stage-popover-group">
              <span class="stage-popover-title">画质与调色</span>
              <div class="stage-popover-grid">
                <label class="hgame-field"><span>画质</span>
                  <select id="hgame-test-quality">
                    <option value="HIGH" selected>High</option>
                    <option value="ORIGINAL">Original</option>
                    <option value="LOW">Low</option>
                    <option value="LOWEST">Lowest</option>
                  </select>
                </label>
                <label class="hgame-field"><span>LOD</span>
                  <select id="hgame-test-lod">
                    <option value="auto">自动</option>
                    <option value="0">LOD0</option>
                    <option value="1">LOD1</option>
                    <option value="2">LOD2</option>
                    <option value="3">LOD3</option>
                  </select>
                </label>
                <label class="hgame-field"><span>调色</span>
                  <select id="hgame-test-lut-cat">
                    <option value="presets" selected>中文预设</option>
                    <option value="all">全部 LUT</option>
                  </select>
                </label>
                <label class="hgame-field"><span>LUT</span>
                  <select id="hgame-test-lut">
                    <option value="none" selected>无</option>
                  </select>
                </label>
                <label class="hgame-field"><span>强度</span><input id="hgame-test-lut-intensity" type="range" min="0" max="1" step="0.05" value="0.85"><output id="hgame-test-lut-val">85%</output></label>
                <label class="hgame-check"><input id="hgame-test-wireframe" type="checkbox"><span>线框</span></label>
                <label class="hgame-check"><input id="hgame-test-colliders" type="checkbox"><span>碰撞</span></label>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="hgame-test-hotbar" class="hgame-test-hotbar" hidden aria-label="2D 物品图标图集预览"></div>
    </section>
  </main>
</body>
</html>
