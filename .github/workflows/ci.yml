name: HGame CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run check:physics
      - run: npm run check:types
      - run: npm run check:api-index

  network:
    name: Network workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: network/package-lock.json
      - run: npm ci --prefix network
      - run: npm --prefix network audit --audit-level=high
      - run: npm --prefix network test
      - run: npm --prefix network run check
      - run: npm --prefix network run build

  browser:
    name: Browser smoke (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/create-game.mjs ${{ runner.temp }}/snap-game --profile 2d --no-git
      - run: npm run snapshot -- ${{ runner.temp }}/snap-game --keys d:200
      - run: npm run test:browser
      - run: npm run test:browser:pbr
      - run: npm run test:browser:snapshot
      - run: node scripts/build-examples.mjs
      - run: npm run test:examples
      - name: Cache OS-native snapshot baselines
        id: snapshot-cache
        uses: actions/cache@v4
        with:
          path: .ci-baselines
          key: ${{ runner.os }}-baselines-${{ hashFiles('examples/**', 'assets/runtime/**', 'scripts/snapshot.mjs') }}
      - name: Example browser verification
        shell: bash
        run: |
          mkdir -p .ci-baselines
          if [ -f .ci-baselines/survivor-2d.png ]; then
            node scripts/snapshot.mjs examples/survivor-2d --ready "#game[data-engine-ready=true]" --freeze-time --steps 120 --keys d:300 --baseline .ci-baselines/survivor-2d.png --threshold 0.01
          else
            node scripts/snapshot.mjs examples/survivor-2d --ready "#game[data-engine-ready=true]" --freeze-time --steps 120 --keys d:300 --baseline .ci-baselines/survivor-2d.png --update-baseline
            node scripts/snapshot.mjs examples/survivor-2d --ready "#game[data-engine-ready=true]" --freeze-time --steps 120 --keys d:300 --baseline .ci-baselines/survivor-2d.png --threshold 0
          fi
          if [ -f .ci-baselines/arena-3d.png ]; then
            node scripts/snapshot.mjs examples/arena-3d --ready "#game[data-engine-ready=true]" --freeze-time --steps 60 --keys d:200 --baseline .ci-baselines/arena-3d.png --threshold 0.01
          else
            node scripts/snapshot.mjs examples/arena-3d --ready "#game[data-engine-ready=true]" --freeze-time --steps 60 --keys d:200 --baseline .ci-baselines/arena-3d.png --update-baseline
            node scripts/snapshot.mjs examples/arena-3d --ready "#game[data-engine-ready=true]" --freeze-time --steps 60 --keys d:200 --baseline .ci-baselines/arena-3d.png --threshold 0
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-baselines
          path: .ci-baselines/
      - run: npm run bench:render -- --json render-bench.json
      - run: npm run bench:render3d -- --json render-bench-3d.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-bench
          path: |
            render-bench.json
            render-bench-3d.json

  bench:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run bench -- --json bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results.json




