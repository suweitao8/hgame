name: HGame CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm audit --prefix assets/profiles/pixi2d --audit-level=high
        if: runner.os == 'Linux'
      - run: npm test
      - run: npm run check:physics
      - run: npm run check:types
      - run: npm run check:api-index
      - run: node scripts/score-engines.mjs --check
      - run: npm run test:webasset

  network:
    name: Network workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: network/package-lock.json
      - run: npm ci --prefix network
      - run: npm --prefix network audit --audit-level=high
      - run: npm --prefix network test
      - run: npm --prefix network run check
      - run: npm --prefix network run build

  browser:
    name: Browser smoke (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: node scripts/create-game.mjs ${{ runner.temp }}/snap-game --profile 2d --no-git
      - run: npm run snapshot -- ${{ runner.temp }}/snap-game --keys d:200
      - run: npm run test:browser -- --webgpu
      - run: npm run test:browser:pbr
      - run: npm run test:browser:snapshot
      - run: npm run test:browser:safety
      - run: npm run test:browser:telemetry
      - run: npm run test:browser:packages
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-browser
          path: build/package-browser/
      - run: node scripts/build-examples.mjs
      - run: npm run test:examples
      - run: npm run test:browser:lifecycle -- --context-recovery
      - run: npm run test:browser:lifecycle -- --mobile
      - run: npm run test:browser:recipes
      - name: Compare against accepted visual reference
        run: npm run check:visual
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: visual-regression
          path: build/visual-regression/
  cross-browser:
    name: Browser compatibility (${{ matrix.browser }})
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Install and verify ${{ matrix.browser }}
        env:
          HGAME_CI_BROWSER: ${{ matrix.browser }}
        shell: bash
        run: |
          if [[ "$HGAME_CI_BROWSER" == webkit ]]; then
            # The EC2 regional mirror stalled on WebKit's multimedia dependencies.
            sudo sed -Ei 's@https?://[[:alnum:].-]+\.ec2\.archive\.ubuntu\.com/ubuntu/?@https://archive.ubuntu.com/ubuntu/@g' \
              /etc/apt/sources.list.d/ubuntu.sources
          fi
          run_logged() {
            local name="$1"
            shift
            mkdir -p build/browser-compatibility
            local log="build/browser-compatibility/$name.log"
            if "$@" 2>&1 | tee "$log"; then
              return
            fi
            local message
            message="$(grep -m1 -E 'Error:|Error \[|^E:' "$log" || true)"
            message="${message:-See the $name.log artifact for details}"
            printf '::error title=%s failed::%s\n' "$name" "${message//%/%25}"
            return 1
          }
          run_logged install npx playwright-core install --with-deps "$HGAME_CI_BROWSER"
          launch=()
          browser_args=(--browser "$HGAME_CI_BROWSER")
          if [[ "$HGAME_CI_BROWSER" == firefox ]]; then
            # Firefox needs a display to initialize WebGL on the Linux runner.
            launch=(xvfb-run -a env LIBGL_ALWAYS_SOFTWARE=1)
            browser_args+=(--headed)
          fi
          run_logged recipes "${launch[@]}" npm run test:browser:recipes -- "${browser_args[@]}"
          run_logged lifecycle "${launch[@]}" npm run test:browser:lifecycle -- "${browser_args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-compatibility-${{ matrix.browser }}
          path: build/browser-compatibility/
  render:
    name: Rendering budget (${{ matrix.workload }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - workload: frame pacing
            script: bench:render
            report: render-bench
          - workload: 3D stress
            script: bench:render3d
            report: render-bench-3d
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run ${{ matrix.script }} -- --json ${{ matrix.report }}.json
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ${{ matrix.report }}
          path: ${{ matrix.report }}.json

  bench:
    name: Performance budgets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run bench -- --json bench-results.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-results
          path: bench-results.json




