<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HGame Look-Dev Realistic 3D</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "../../assets/optional/three/three.module.js",
        "three/examples/jsm/": "../../assets/optional/three/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="drop-overlay" hidden>Drop .glb / .hmat.json / .hmesh.json to Hot-Reload</div>
  <aside id="hud">
    <div class="hud-title">Look-Dev 32m × 32m</div>
    <div id="metrics" class="hud-metrics">Loading...</div>
    <div class="hud-row">
      <label>Quality</label>
      <select id="ctrl-quality">
        <option value="HIGH" selected>HIGH (512px)</option>
        <option value="LOW">LOW (256px)</option>
      </select>
    </div>
    <div class="hud-row">
      <label>Weather</label>
      <select id="ctrl-lighting">
        <option value="OVERCAST_WET" selected>OVERCAST_WET</option>
        <option value="GOLDEN_HOUR">GOLDEN_HOUR</option>
        <option value="NOON_CLEAR">NOON_CLEAR</option>
      </select>
    </div>
    <div class="hud-row">
      <label>Biome</label>
      <select id="ctrl-biome">
        <option value="wet_moss" selected>Wet Moss</option>
        <option value="desert_dust">Desert Dust</option>
        <option value="clean_indoor">Clean Indoor</option>
      </select>
    </div>
    <div class="hud-row">
      <label>Baker</label>
      <select id="ctrl-bakemode">
        <option value="auto" selected>AUTO (GPU First)</option>
        <option value="gpu">GPU FBO</option>
        <option value="cpu">CPU</option>
      </select>
    </div>
    <div class="hud-row">
      <label>Wetness <span id="wetness-val">0.55</span></label>
      <input id="ctrl-wetness" type="range" min="0" max="1" step="0.05" value="0.55">
    </div>
    <div class="hud-row">
      <label><input id="ctrl-tripo" type="checkbox" checked> Tripo Normalize</label>
    </div>
    <div class="hud-cameras">
      <button data-cam="overview">Overview</button>
      <button data-cam="brick_closeup">Brick 1m/4m</button>
      <button data-cam="industrial">Industrial</button>
      <button data-cam="interior">Interior</button>
      <button data-cam="plinths">13 Mats</button>
      <button data-cam="puddle">Puddle</button>
      <button data-cam="character">Character</button>
    </div>
    <div id="audit-log" class="hud-audit"></div>
  </aside>
  <script type="module" src="./app.js"></script>
</body>
</html>
