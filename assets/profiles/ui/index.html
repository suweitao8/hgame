<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HTML 游戏</title>
  <style>
    html,body { margin:0; min-height:100%; background:#111720; color:#eee; font:16px system-ui; }
    main { min-height:100vh; display:grid; align-content:center; justify-items:center; gap:16px; }
    button { border:1px solid #789b99; border-radius:8px; background:#233d41; color:#eafff7; padding:12px 22px; cursor:pointer; }
  </style>
</head>
<body>
  <main>
    <div aria-live="polite">抽取次数：<strong id="count">0</strong></div>
    <button id="draw" type="button" disabled>抽取</button>
  </main>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
