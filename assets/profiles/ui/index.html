<!doctype html>
<html lang="zh-CN">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111">
  <title>HTML 游戏</title>
  <style>
    html,body { margin:0; width:100%; height:100%; overflow:hidden; background:#111720; color:#eee; font:16px system-ui; user-select:none; -webkit-user-select:none; }

    button { border:1px solid #789b99; border-radius:8px; background:#233d41; color:#eafff7; padding:12px 22px; cursor:pointer; touch-action:manipulation; }
  </style>
</head>
<body>
  <main>
    <div aria-live="polite">×<strong id="count">0</strong></div>
    <button id="draw" type="button" disabled>抽取</button>
  </main>
